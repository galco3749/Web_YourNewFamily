<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 FORM</title>
    <link rel="stylesheet" href="Css/Style.css">
</head>
<body>
    <section id="form">
    <section class="form-wrapper">
        <div class="card-form">
            <div class="form-header">
                <h1>Contacta con nosotros</h1>
                <p>¿Quieres la BETA del juego? ¡Escríbenos!</p>
            </div>

            <form>
                <div class="rel-input-group">
                    <input type="text" id="name" name="name" required maxlength="50">
                    <label for="name">Nombre completo:</label>                  
                </div>
                <div class="rel-input-group">
                    <input type="email" name="email" id="email" required maxlength="30">
                    <label for="email">Tu email de contacto:</label>
                </div>
                <div>
                    <legend>¿Tienes cuenta con nosotros?</legend>
                    <label for="account">Sí</label>
                    <input type="radio" name="account" id="acc_yes" >
                    <label for="account">No</label>
                    <input type="radio" name="account" id="acc_no" >
                </div>
                <div class="rel-buttons">
                    <legend>¿Qué quieres recibir?</legend>
                    <label for="beta">Quiero la BETA</label>
                    <input type="checkbox" name="beta" id="beta">
                    <label for="ost">Quiero la OST</label>
                    <input type="checkbox" name="ost" id="ost">
                    <label for="comic">Quiero el comic</label>
                    <input type="checkbox" name="comic" id="comic">
                    <label for="figura">Quiero la figura</label>
                    <input type="checkbox" name="figura" id="figura">
                    <label for="cartas">Quiero el juego de cartas</label>
                    <input type="checkbox" name="cartas" id="cartas">
                </div>
                <div class="rel-input-group">
                    <textarea name="msg" id="msg"></textarea>
                    <label for="msg">Dejanos un comentario: </label>                   
                </div>
                <div>
                    <input id="submitBtn" type="submit" value="Enviar!">
                </div>
            </form>
        </div>
    </section>
    <a href="index.html">volver a página inicial</a>
    </section>
</body>
</html>
